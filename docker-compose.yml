services:
  postgres:
    image: postgres:16-alpine
    container_name: juspeace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: juspeace_develop
      # Persist/interpret session timestamps in UTC (pairs with Prisma @db.Timestamptz)
      TZ: UTC
      PGTZ: UTC
    volumes:
      - juspeace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d juspeace_develop']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: juspeace-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  juspeace-be:
    build:
      context: ./juspeace-be
      dockerfile: Dockerfile
    container_name: juspeace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '${BE_PORT:-7777}:7777'
    env_file:
      - path: ./juspeace-be/.env
        required: false
    environment:
      # Docker network / listen overrides (win over env_file host-local values)
      NODE_ENV: production
      PORT: 7777
      TZ: UTC
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://postgres:root@postgres:5432/juspeace_develop?schema=public
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'

  juspeace-fe:
    build:
      context: ./juspeace-fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BE_PORT:-7777}/api/v1}
    container_name: juspeace-frontend
    restart: unless-stopped
    depends_on:
      - juspeace-be
    ports:
      - '${FE_PORT:-3000}:3000'
    env_file:
      - path: ./juspeace-fe/.env
        required: false
      - path: ./juspeace-fe/.env.local
        required: false
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0

  juspeace-admin-fe:
    build:
      context: ./juspeace-admin-fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BE_PORT:-7777}/api/v1}
    container_name: juspeace-admin-frontend
    restart: unless-stopped
    depends_on:
      - juspeace-be
    ports:
      - '${ADMIN_FE_PORT:-3001}:3001'
    env_file:
      - path: ./juspeace-admin-fe/.env
        required: false
      - path: ./juspeace-admin-fe/.env.local
        required: false
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0

volumes:
  juspeace_postgres_data:
