services:
  postgres:
    image: postgres:16-alpine
    container_name: juspeace-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: juspeace_develop
      # Persist/interpret session timestamps in UTC (pairs with Prisma @db.Timestamptz)
      TZ: UTC
      PGTZ: UTC
    volumes:
      - juspeace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d juspeace_develop']
      interval: 5s
      timeout: 5s
      retries: 10

  juspeace-be:
    build:
      context: ./juspeace-be
      dockerfile: Dockerfile
    container_name: juspeace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '7777:7777'
    environment:
      NODE_ENV: production
      PORT: 7777
      TZ: UTC
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: root
      DB_DATABASE: juspeace_develop
      DATABASE_URL: postgresql://postgres:root@postgres:5432/juspeace_develop?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-juspeace_refresh}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}

  juspeace-fe:
    build:
      context: ./juspeace-fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7777/api/v1}
    container_name: juspeace-frontend
    restart: unless-stopped
    depends_on:
      - juspeace-be
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7777/api/v1}
      PORT: 3000
      HOSTNAME: 0.0.0.0

volumes:
  juspeace_postgres_data:
