services:
  juspeace-admin-fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BE_PORT:-7777}/api/v1}
    container_name: juspeace-admin-frontend
    restart: unless-stopped
    ports:
      - '${ADMIN_FE_PORT:-3001}:3001'
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
